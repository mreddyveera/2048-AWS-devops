name: Docker Image Build and push to a Registry
'on':
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
permissions:
  contents: read
  id-token: write
jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Generate Image Tag
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: '${{ vars.ROLE_ARN}}'
          aws-region: '${{ vars.AWS_REGION }}'
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build Docker Image
        run: >
          docker build \

          -f docker/Dockerfile \

          -t ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY
          }}:${{ env.SHORT_SHA }} \

          -t ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY
          }}:develop-latest \

          .
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: >-
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY
            }}:${{ env.SHORT_SHA }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Push Commit Tag
        run: >
          docker push \

          ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{
          env.SHORT_SHA }}
      - name: Push Develop Latest Tag
        run: >
          docker push \

          ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY
          }}:develop-latest
